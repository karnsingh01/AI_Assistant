<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1 class="main-heading">AI Personal Assistant</h1>

    <div class="container">

        <h2>Ask Anything</h2>
        <form id="askForm">
            <input type="text" name="question" placeholder="Ask anything..." required>
            <button type="submit">Ask</button>
        </form>
        <p id="ans-loading" style="display: none;">Processing...</p>
        <p id="answer"></p>

        <hr>

        <h2>Summarize Email</h2>
        <form id="emailForm">
            <textarea type="text" name="email" placeholder="Paste your email here.." required></textarea>
            <button type="submit">Summarize</button>
        </form>
        <p id="summary-loading" style="display: none;">Processing...</p>
        <p id="summary"></p>

    </div>

<script>
async function handleRequest(formId, endpoint, loadingId, resultId) {
    const form = document.getElementById(formId);
    const loading = document.getElementById(loadingId);
    const result = document.getElementById(resultId);
    const button = form.querySelector('button[type="submit"]');

    form.onsubmit = async (e) => {
        e.preventDefault();

        loading.style.display = "block";
        loading.innerText = "Processing...";
        result.innerText = "";
        button.disabled = true;

        try {
            const response = await fetch(endpoint, {
                method: "POST",
                body: new FormData(form),
                signal: AbortSignal.timeout(60000)
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Request failed.");
            }

            result.innerText = data.response || "No response received.";

        } catch (error) {
            if (error.name === "TimeoutError") {
                result.innerText =
                    "The request timed out. Please try again.";
            } else {
                result.innerText =
                    "Error: " + error.message;
            }

            console.error("Request error:", error);

        } finally {
            loading.style.display = "none";
            button.disabled = false;
        }
    };
}

handleRequest("askForm", "/ask", "ans-loading", "answer");
handleRequest(
    "emailForm",
    "/summarize",
    "summary-loading",
    "summary"
);
</script>

</body>
</html>
